# `prefer-lowest` is the leg that catches a constraint looser than the code: it resolves the oldest
# versions composer.json permits, which is what a consumer on a conservative lockfile actually gets.
#
# One leg runs with `ext-intl` REMOVED. This package does not use the extension — it deals in ISO
# codes and never resolves a country name — and `composer.json` says so by listing it under `suggest`
# rather than `require`. That claim is the thing being guarded: the day someone adds a `Locale::`
# call, a suggest silently becomes a hidden requirement and every consumer without the extension
# breaks at runtime rather than at install.

name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: PHP ${{ matrix.php }} · ${{ matrix.dependency-versions }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependency-versions: ['prefer-lowest', 'prefer-stable']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache Composer files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ matrix.dependency-versions }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's
        # dist cache is keyed on a name whose contents change underneath it. A
        # restored archive is then silently stale: `composer install` reports
        # success and unpacks whatever was cached the first time. That is how
        # `vendor/bin/laranail-pint` went missing here while the tag carried it.
        # Everything else is immutable per version and stays cached.
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          if [ "${{ matrix.dependency-versions }}" = "prefer-lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --prefer-stable --no-interaction --no-progress
          fi

      - name: Run the suite
        run: composer test

  # The matrix above always installs `ext-intl`, so it cannot prove the package works without it.
  # This leg removes it and runs the whole suite.
  without-intl:
    name: Without ext-intl
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `:intl` DISABLES the extension. Merely leaving it off the list does not remove it — the
      # runner's PHP ships with intl enabled, so an omission is a no-op and the leg passes while
      # proving nothing. That is exactly what this job did until the assertion below caught it.
      - name: Setup PHP without intl
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo_sqlite, sqlite3, :intl
          coverage: none

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer update --prefer-stable --no-interaction --no-progress

      # Without this the job is decorative: a green run would mean "the extension was present after
      # all", which is the same result as the matrix legs.
      - name: Confirm the extension really is absent
        run: |
          php -r 'if (extension_loaded("intl")) { fwrite(STDERR, "ext-intl is loaded; this leg proves nothing.\n"); exit(1); }'

      - name: Run the suite
        run: composer test
